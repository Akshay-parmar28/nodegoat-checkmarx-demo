version: '3.8'

services:
  web:
    build: .
    container_name: nodegoat-web
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/nodegoat
      - COOKIE_SECRET=${COOKIE_SECRET:-dev-only-insecure-cookie-secret}
      - CRYPTO_KEY=${CRYPTO_KEY:-dev-only-insecure-crypto-key}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root-dev-token
    depends_on:
      - mongo
      - vault
    command: >
      sh -c "until nc -z -w 2 mongo 27017; do
               echo 'Waiting for mongo dependency...';
               sleep 2;
             done;
             node artifacts/db-reset.js && npm start"

  mongo:
    image: mongo:4.4
    container_name: nodegoat-mongo
    ports:
      - "27017:27017"

  vault:
    image: hashicorp/vault:latest
    container_name: nodegoat-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK