name: E2E Test
on: [push, pull_request]

jobs:
  e2e-test:
    name: Node.js
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x"]

    steps:
      - name: Checkout https://github.com/${{ github.repository }}@${{ github.ref }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: ${{ runner.os }}-node${{ matrix.node-version }}-E2E-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          npm run cy:verify

      - name: Start MongoDB
        run: |
          docker run -d --name nodegoat-mongo -p 27017:27017 mongo:4.4
          for attempt in {1..30}; do
            if docker exec nodegoat-mongo mongo --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx 1; then
              echo "MongoDB ready"
              exit 0
            fi
            sleep 2
          done
          docker logs nodegoat-mongo
          exit 1

      - name: Seed test database
        run: npm run db:seed

      - name: Run E2E test suite
        id: test-suite
        run: |
          NODE_ENV=test npm start -- --silent > /tmp/nodegoat.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4000/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://localhost:4000/login >/dev/null || { cat /tmp/nodegoat.log; exit 1; }
          npm run test:ci -- --config video=true

      - name: Show application logs on failure
        if: failure() && (steps.test-suite.outcome == 'failure')
        run: cat /tmp/nodegoat.log

      - name: Prepare cypress artifacts
        if: failure() && (steps.test-suite.outcome == 'failure')
        working-directory: ./test/e2e
        run: >
          mkdir -p "screenshots" && find "screenshots" -mindepth 1 -maxdepth 1 -type d
          -exec sh -c 'mv -- "videos/$(basename "$1").mp4" "$1"' _ {} \;

      - name: Upload cypress artifacts
        if: failure() && (steps.test-suite.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-node${{ matrix.node-version }}
          path: test/e2e/screenshots
