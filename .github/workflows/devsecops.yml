name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  dependency-security:
    name: Dependency Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --json \
            --output semgrep-results.json .

          python - <<'PY'
          import json

          with open("semgrep-results.json") as f:
              data = json.load(f)

          print(f"Semgrep findings: {len(data.get('results', []))}")
          PY