# KICS - Infrastructure as Code scanning
# Scans the Azure Terraform in infra/, the Dockerfile, docker-compose.yml and the GitHub workflow files.
# Results go to: PR comment + annotations, Security > Code scanning (SARIF), the job summary,
# and a downloadable "kics-reports" artifact (JSON, SARIF and a readable HTML report).
name: KICS IaC scan

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write      # PR comment with the results table
  security-events: write    # upload SARIF to Code scanning

jobs:
  kics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Create results folder
        run: mkdir -p kics-results

      - name: Run KICS
        uses: checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: "."
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: kics-results
          output_formats: "json,sarif,html"
          # A PR comment only makes sense on a pull request. On a push there is no PR,
          # and the failed comment call would also skip the pass/fail decision below.
          enable_comments: ${{ github.event_name == 'pull_request' }}
          comments_with_queries: true
          enable_jobs_summary: true
          enable_annotations: true
          # Policy gate: CRITICAL and HIGH findings break the build, MEDIUM and LOW are reported
          fail_on: critical,high

      - name: Upload SARIF to GitHub Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: kics-results/results.sarif
          category: kics

      - name: Keep the full reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kics-reports
          path: kics-results/
          retention-days: 30
          if-no-files-found: error   # a run without a report is a failed run
