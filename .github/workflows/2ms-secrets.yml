# 2ms (Too Many Secrets) - leaked secret detection
# Two scans:
#   1. Current files  -> SARIF to Security > Code scanning, and it gates the build
#   2. Full git history -> table in the job summary (deleted secrets still live in history)
# The secret values themselves are removed from every report before it leaves the runner.
# Every run also leaves a "2ms-reports" artifact (JSON + SARIF) and a job summary with both tables.
name: 2ms secret detection

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  TWOMS_VERSION: v5.4.0
  # SHA-256 of linux-amd64.zip for the version above (upstream publishes no checksum file,
  # so this was recorded on first download and pins exactly that build)
  TWOMS_SHA256: 5c8a94a53cd6f811b85e19f7d2ceae555355813e954b6ae5697d579ba92319dc
  # Triaged false positive: the example.com URL in an Express code comment (old node_modules commit)
  TWOMS_IGNORE: --ignore-result 6ecc5b3ff6b592c227995d9d316d6eb0046e96d2 --ignore-result 8613085032452cd54e39da365bea59010a1e5842

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0   # required, otherwise the history scan only sees one commit
          persist-credentials: false

      - name: Install 2ms (pinned version, checksum verified)
        run: |
          curl -fsSL -o /tmp/2ms.zip "https://github.com/checkmarx/2ms/releases/download/${TWOMS_VERSION}/linux-amd64.zip"
          echo "${TWOMS_SHA256}  /tmp/2ms.zip" | sha256sum -c -
          unzip -o -q /tmp/2ms.zip -d /tmp/2ms-bin
          chmod +x /tmp/2ms-bin/2ms
          /tmp/2ms-bin/2ms --version
          mkdir -p 2ms-results

      - name: Scan current files
        id: fs
        run: |
          /tmp/2ms-bin/2ms filesystem --path . \
            --ignore-pattern "2ms-results" \
            --report-path 2ms-results/files.sarif \
            --report-path 2ms-results/files.json \
            --ignore-on-exit results \
            --disable-console-report \
            --log-level error
          COUNT=$(jq '.totalSecretsFound' 2ms-results/files.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Scan full git history
        id: history
        run: |
          /tmp/2ms-bin/2ms git . \
            --report-path 2ms-results/history.json \
            --ignore-on-exit results \
            --disable-console-report \
            --log-level error \
            $TWOMS_IGNORE
          COUNT=$(jq '.totalSecretsFound' 2ms-results/history.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Remove secret values from the reports
        if: always()
        run: |
          shopt -s nullglob
          # JSON reports: drop the secret and the line that contains it
          for f in 2ms-results/*.json; do
            jq '.results |= map_values(map(del(.value, .lineContent)))' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          # SARIF: drop the code snippet (it holds the secret), and give each rule a security
          # severity from its CVSS score so Code scanning shows it as High instead of Warning
          for f in 2ms-results/*.sarif; do
            jq '.runs |= map(
                  (.results // []) as $res
                  | .tool.driver.rules |= ((. // []) | map(. as $r
                      | .properties.tags = ["security", "secret"]
                      | .properties["security-severity"] =
                          (([$res[] | select(.ruleId == $r.id) | .properties.cvssScore] | max) // 8.0 | tostring)))
                  | .results |= ((. // []) | map(.level = "error" | del(.locations[]?.physicalLocation.region.snippet))))' \
              "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 2ms secret detection"
            echo ""
            echo "| Scope | Secrets found |"
            echo "|---|---|"
            echo "| Current files | ${{ steps.fs.outputs.count }} |"
            echo "| Full git history | ${{ steps.history.outputs.count }} |"
            echo ""
            echo "### Findings in the current files (secret values are not printed)"
            echo ""
            echo "| Rule | Severity | File | Line |"
            echo "|---|---|---|---|"
            jq -r '[(.results // {})[][]] | sort_by(.source, .startLine) | .[]
              | "| \(.ruleName) | \(.severity) | `\(.source)` | \(.startLine) |"' 2ms-results/files.json
            echo ""
            echo "### Findings in git history (secret values are not printed)"
            echo ""
            echo "| Rule | Severity | File | Line | Commit |"
            echo "|---|---|---|---|---|"
            jq -r --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit" '.results[][]
              | (.source | capture("^git show (?<sha>[0-9a-f]+):(?<file>.*)$")) as $s
              | "| \(.ruleName) | \(.severity) | \($s.file) | \(.startLine) | [\($s.sha[0:7])](\($url)/\($s.sha)) |"' \
              2ms-results/history.json | sort -u
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: 2ms-results/files.sarif
          category: 2ms

      - name: Keep the full reports (secret values removed)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 2ms-reports
          path: 2ms-results/
          retention-days: 30
          if-no-files-found: error   # a run without a report is a failed run

      - name: Policy gate - fail if secrets are in the current code
        if: steps.fs.outputs.count != '0'
        run: |
          echo "::error::${{ steps.fs.outputs.count }} secret(s) found in the current code. Rotate them and move them to a vault."
          exit 1
