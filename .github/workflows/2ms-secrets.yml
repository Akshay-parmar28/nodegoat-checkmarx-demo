# 2ms (Too Many Secrets) - leaked secret detection
# Two scans:
#   1. Current files  -> SARIF to Security > Code scanning, and it gates the build
#   2. Full git history -> table in the job summary (deleted secrets still live in history)
name: 2ms secret detection

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  TWOMS_VERSION: v5.4.0

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # required, otherwise the history scan only sees one commit

      - name: Install 2ms
        run: |
          curl -sSL -o /tmp/2ms.zip "https://github.com/checkmarx/2ms/releases/download/${TWOMS_VERSION}/linux-amd64.zip"
          unzip -o -q /tmp/2ms.zip -d /tmp/2ms-bin
          chmod +x /tmp/2ms-bin/2ms
          /tmp/2ms-bin/2ms --version
          mkdir -p 2ms-results

      - name: Scan current files
        id: fs
        run: |
          /tmp/2ms-bin/2ms filesystem --path . \
            --ignore-pattern "2ms-results" \
            --report-path 2ms-results/files.sarif \
            --report-path 2ms-results/files.json \
            --ignore-on-exit results \
            --log-level error
          COUNT=$(jq '.totalSecretsFound' 2ms-results/files.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Scan full git history
        id: history
        run: |
          /tmp/2ms-bin/2ms git . \
            --report-path 2ms-results/history.json \
            --ignore-on-exit results \
            --log-level error
          COUNT=$(jq '.totalSecretsFound' 2ms-results/history.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 2ms secret detection"
            echo ""
            echo "| Scope | Secrets found |"
            echo "|---|---|"
            echo "| Current files | ${{ steps.fs.outputs.count }} |"
            echo "| Full git history | ${{ steps.history.outputs.count }} |"
            echo ""
            echo "### Findings in git history (secret values are not printed)"
            echo ""
            echo "| Rule | Severity | File | Line |"
            echo "|---|---|---|---|"
            jq -r '.results[][] | "| \(.ruleName) | \(.severity) | \(.source | sub("^git show [0-9a-f]+:"; "")) | \(.startLine) |"' \
              2ms-results/history.json | sort -u
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: 2ms-results/files.sarif
          category: 2ms

      - name: Keep the full reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 2ms-reports
          path: 2ms-results/
          retention-days: 7

      - name: Policy gate - fail if secrets are in the current code
        if: steps.fs.outputs.count != '0'
        run: |
          echo "::error::${{ steps.fs.outputs.count }} secret(s) found in the current code. Rotate them and move them to a vault."
          exit 1
