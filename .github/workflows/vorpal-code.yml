# Vorpal - secure-coding checks on the developer's pull request
# Vorpal scans individual files (Java, JavaScript, C#, Python, Go), so we pass it
# only the JavaScript files changed in the PR. Findings appear as annotations on the PR.
# Changed files are computed with plain git (no third-party changed-files action).
name: Vorpal code scan

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vorpal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: List changed JavaScript files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR \
                    "origin/${{ github.base_ref }}...HEAD" -- '*.js' \
                  | { grep -v '^node_modules/' || true; } | paste -sd, -)
          echo "Changed JS files: ${FILES:-none}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Vorpal with reviewdog
        if: steps.changed.outputs.files != ''
        uses: checkmarx/vorpal-reviewdog-github-action@8cc292f337a2f1dea581b4f4bd73852e7becb50d # v1.2.0
        with:
          source_path: ${{ steps.changed.outputs.files }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check   # annotations on the lines; use github-pr-review for PR comments
          filter_mode: file           # report every finding in the changed files; "added" = only new lines
          level: error
          fail_on_error: true         # red check when Vorpal finds an issue
